name: Update README
concurrency:
  group: readme-update
  cancel-in-progress: false
on:
  schedule:
    - cron: '0 1 * * *' # Runs daily at 01:00 UTC (06:30 IST)
  workflow_dispatch:
    inputs:
      run_ai:
        description: 'Regenerate the AI summary sections (GEMINI_API_KEY required)'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - master
jobs:
  update-readme:
    name: Update dynamic sections
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Update blog posts
        run: node .github/scripts/update_blog_posts.js
        continue-on-error: true

      - name: Update employment duration
        run: node .github/scripts/update_duration.js

      - name: Update recent repositories
        run: node .github/scripts/update_recent_repos.js
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Update top projects
        run: node .github/scripts/update_top_projects.js
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Generate AI Daily Summary
        if: ${{ inputs.run_ai != false }}
        run: node .github/scripts/generate_ai_summary.js
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add README.md resume.pdf
          git commit -m "Update dynamic content" || echo "No changes to commit"
          git push
  generate-snake:
    name: Generate contribution snake
    needs: update-readme
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
